<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject — ScoreTracker 27</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="subject">

    <header class="header">
        <div class="header-left">
            <a href="index.html" class="back-btn" aria-label="Back to dashboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
            </a>
            <div class="logo">
                <h1 class="logo-text" id="subjectTitle">Subject</h1>
            </div>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5" />
                <path
                    d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
        </button>
    </header>

    <main class="container">

        <!-- ═══════════ SCORE ENTRY ═══════════ -->
        <section class="card score-entry">
            <div class="card-header">
                <h2>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="section-icon">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                    </svg>
                    <span id="formTitle">Add Score</span>
                </h2>
            </div>
            <form id="scoreForm" autocomplete="off">
                <div class="form-row-3">
                    <div class="form-group">
                        <label for="scoreDate">Date</label>
                        <input type="date" id="scoreDate" required>
                    </div>
                    <div class="form-group">
                        <label for="scoreValue" id="scoreLabel">Score</label>
                        <input type="number" id="scoreValue" min="0" max="100" placeholder="0 – 100" required>
                    </div>
                    <div class="form-group">
                        <label for="paperName">Paper Name <span class="optional-tag">optional</span></label>
                        <input type="text" id="paperName" placeholder="e.g. Unit Test 1" maxlength="50">
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    Add Score
                </button>
            </form>
        </section>

        <!-- ═══════════ STATS ═══════════ -->
        <section class="stats-row single-stat" id="subjectStats">
            <!-- Built by JS -->
        </section>

        <!-- ═══════════ CHART ═══════════ -->
        <section class="card chart-section">
            <div class="card-header">
                <h2>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="section-icon">
                        <path d="M18 20V10" />
                        <path d="M12 20V4" />
                        <path d="M6 20v-6" />
                    </svg>
                    Progress
                </h2>
                <div class="chart-tabs" id="chartTabs">
                    <button class="tab active" data-range="month">Monthly</button>
                    <button class="tab" data-range="3months">3 Months</button>
                    <button class="tab" data-range="year">Yearly</button>
                </div>
            </div>
            <div class="chart-wrapper">
                <canvas id="scoreChart"></canvas>
            </div>
            <p class="chart-empty-msg" id="chartEmptyMsg">Add some scores to see your progress chart ✨</p>
        </section>

        <!-- ═══════════ HISTORY TABLE ═══════════ -->
        <section class="card history-section">
            <div class="card-header">
                <h2>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="section-icon">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                        <line x1="16" y1="2" x2="16" y2="6" />
                        <line x1="8" y1="2" x2="8" y2="6" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                    </svg>
                    Score History
                </h2>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Paper</th>
                            <th>Score</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
            <p class="table-empty-msg" id="tableEmptyMsg">No scores yet — add your first score above! 🚀</p>
        </section>
    </main>

    <div class="toast" id="toast"></div>
    <script src="js/app.js"></script>
</body>

</html>
