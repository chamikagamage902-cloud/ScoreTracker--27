<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>ScoreTracker 27 — Dashboard</title>
    <meta name="description" content="Track your exam scores over time with beautiful interactive charts.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="home">

    <!-- ═══════════ HEADER ═══════════ -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                </svg>
                <h1 class="logo-text">ScoreTracker 27</h1>
            </div>
        </div>
        <div class="header-right">
            <span class="exam-badge" id="examBadge"></span>
            <span class="user-greeting" id="userGreeting"></span>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5" />
                    <path
                        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <button class="btn-logout" id="logoutBtn" title="Logout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
        </div>
    </header>

    <main class="container">

        <!-- ═══════════ SUBJECT NAV CARDS (built by JS) ═══════════ -->
        <section class="subject-nav" id="subjectNav"></section>

        <!-- ═══════════ STATS OVERVIEW (built by JS) ═══════════ -->
        <section class="stats-row" id="statsRow"></section>

        <!-- ═══════════ COMBINED CHART ═══════════ -->
        <section class="card chart-section" id="chartSection">
            <div class="card-header">
                <h2>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="section-icon">
                        <path d="M18 20V10" />
                        <path d="M12 20V4" />
                        <path d="M6 20v-6" />
                    </svg>
                    All Subjects
                </h2>
                <div class="chart-tabs" id="chartTabs">
                    <button class="tab active" data-range="month">Monthly</button>
                    <button class="tab" data-range="3months">3 Months</button>
                    <button class="tab" data-range="year">Yearly</button>
                </div>
            </div>
            <div class="chart-wrapper">
                <canvas id="scoreChart"></canvas>
            </div>
            <p class="chart-empty-msg" id="chartEmptyMsg">Add scores from the subject pages to see your performance
                chart ✨</p>
        </section>

        <!-- ═══════════ COMBINED HISTORY TABLE ═══════════ -->
        <section class="card history-section" id="historySection">
            <div class="card-header">
                <h2>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="section-icon">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                        <line x1="16" y1="2" x2="16" y2="6" />
                        <line x1="8" y1="2" x2="8" y2="6" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                    </svg>
                    All Scores
                </h2>
            </div>
            <div class="table-wrapper">
                <table id="historyTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Subject</th>
                            <th>Paper</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
            <p class="table-empty-msg" id="tableEmptyMsg">No scores yet. Pick a subject above and start adding scores!
                🚀</p>
        </section>

    </main>

    <div class="toast" id="toast"></div>
    <script src="js/app.js"></script>
</body>

</html>
