<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>ScoreTracker 27 — Welcome</title>
    <meta name="description"
        content="Set up your ScoreTracker 27 profile to start tracking your O/L or A/L exam scores.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo">
                <svg class="login-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                </svg>
                <h1 class="login-logo-text">ScoreTracker 27</h1>
                <p class="login-subtitle">Track your O/L & A/L exam scores</p>
            </div>

            <!-- Auth Tabs -->
            <div class="auth-tabs" id="authTabs">
                <button class="auth-tab active" data-mode="login">Log In</button>
                <button class="auth-tab" data-mode="signup">Create Account</button>
            </div>

            <!-- ═══ LOGIN FORM ═══ -->
            <form id="loginForm" class="auth-form" autocomplete="off">
                <div class="form-group">
                    <label for="loginEmail">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                        Email
                    </label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        Password
                    </label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required minlength="4">
                </div>
                <button type="submit" class="btn-primary login-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                    Log In
                </button>
                <div class="auth-divider"><span>or</span></div>
                <button type="button" class="btn-google" id="googleLoginBtn">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Sign in with Google
                </button>
            </form>

            <!-- ═══ SIGNUP FORM ═══ -->
            <form id="signupForm" class="auth-form" style="display:none;" autocomplete="off">
                <!-- Step 1: Account details -->
                <div id="signupStep1">
                    <div class="form-group">
                        <label for="signupName">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                class="label-icon">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                            Full Name
                        </label>
                        <input type="text" id="signupName" placeholder="Enter your name" required maxlength="40">
                    </div>
                    <div class="form-group">
                        <label for="signupEmail">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                class="label-icon">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                            Email
                        </label>
                        <input type="email" id="signupEmail" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                class="label-icon">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                            Password
                        </label>
                        <input type="password" id="signupPassword" placeholder="Create a password" required
                            minlength="4">
                    </div>

                    <!-- Exam Type -->
                    <div class="exam-type-section">
                        <label class="selection-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                class="label-icon">
                                <path d="M12 20h9" />
                                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                            </svg>
                            Exam Type
                        </label>
                        <div class="exam-type-toggle" id="examTypeToggle">
                            <button type="button" class="exam-btn active" data-type="OL">O/L</button>
                            <button type="button" class="exam-btn" data-type="AL">A/L</button>
                        </div>
                    </div>

                    <button type="button" class="btn-primary" id="toStep2Btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                        Next — Choose Subjects
                    </button>
                    <div class="auth-divider"><span>or</span></div>
                    <button type="button" class="btn-google" id="googleSignupBtn">
                        <svg class="google-icon" viewBox="0 0 24 24">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                                fill="#4285F4" />
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853" />
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                fill="#FBBC05" />
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335" />
                        </svg>
                        Sign up with Google
                    </button>
                </div>

                <!-- Step 2: Subject Selection -->
                <div id="signupStep2" style="display:none;">
                    <button type="button" class="step-back-btn" id="backToStep1">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6" />
                        </svg>
                        Back to account details
                    </button>

                    <div class="subject-selection">
                        <label class="selection-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                class="label-icon">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                            </svg>
                            Choose Your 3 Main Subjects
                        </label>
                        <p class="selection-hint">Select exactly 3 subjects for your exam</p>
                        <div class="subject-grid" id="mainSubjectGrid"></div>
                        <p class="selection-count" id="mainSelectionCount">0 / 3 selected</p>
                    </div>

                    <div class="subject-selection optional-section">
                        <label class="selection-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                class="label-icon">
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                            Additional Subjects <span class="optional-tag">optional</span>
                        </label>
                        <p class="selection-hint">Add any extra subjects you'd like to track</p>
                        <div class="subject-grid" id="optionalSubjectGrid"></div>
                    </div>

                    <button type="submit" class="btn-primary login-btn" id="signupSubmitBtn" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                        Create Account
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="js/app.js"></script>
</body>

</html>
